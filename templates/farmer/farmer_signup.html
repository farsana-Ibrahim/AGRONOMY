					<h1><a href="{% static 'index.html'%}"><span>G</span>erminate<i>Grow healthy products</i></a></h1>

                <form action="farmer_signup" method="POST" enctype="multipart/form-data" >
                   <center> <h1 style="text-align:center; padding-top:10px;     padding-left: 180px;
                    color:#f4f7f2;">Sign Up As Farmer</h1></center>
                    <br>
                    <center><div style=" background-color:#e1f5d4f1; height:450px; width:350px;  border-radius:50px; text-align:center;" class="col-md-offset-4">
                    {% csrf_token %}
                    {% if error%}
                                    <div class="alert alert-danger" role="alert">
                                        {{error}}
                                    </div>
                                    {% endif %}
                    <div class="col-sm-12" style="padding-top:10px;">
                    <input type="text" class="form-control" name="panchayath" placeholder="Panchayath Name" name="firstname" style="border-radius:15px;"required>
                    </div>
                    <div class="col-sm-12" style="padding-top:10px;">
                    <input type="text" class="form-control" name="name" placeholder="Name" name="firstname" style="border-radius:15px;"required>
                    </div>
                    <div class="col-sm-12" style="padding-top:10px;">
                    <label>PROFILE PHOTO</label>
                    <input type="file" class="form-control"  placeholder="Enter email" name="img" style="border-radius:15px;"required>
                    </div>

                    <div class="col-sm-12" style="padding-top:10px;">
                    <input type="email" class="form-control" name="email" placeholder="Enter email" name="email" style="border-radius:15px;"required>
                    </div>
                    <div class="col-sm-12" style="padding-top:10px;">
                    <input type="text" class="form-control" name="mobno" placeholder="Enter Mobile No." name="mobileno" style="border-radius:15px;" pattern=[6-9]{1}[0-9]{9} title=" please enter a valid mobile number, starting number should be 6 or 7 or 8 or 9"required>
                    </div>
                    <div class="col-sm-12" style="padding-top:10px;">
                    <input type="text" class="form-control" name="adharno" placeholder="Adhar Number"  style="border-radius:15px;"required>
                    </div>
                    <div class="col-sm-12" style="padding-top:10px;">
                    <label>LAND TAX BILL RECEIPT</label>
                    <input type="file" class="form-control" name="proof"  style="border-radius:15px;"required>
                    </div>
                    <div class="col-sm-12" style="padding-top:10px;">
                    <input type="password" class="form-control" name="pwd" placeholder="Type your Password" name="password" style="border-radius:15px;" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"required>
                    </div>
                    <div class="col-sm-12" style="padding-top:10px;">
                        <input type="password" class="form-control" name="pwd1" placeholder="Confirm your Password" name="password" style="border-radius:15px;" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"required>
                        </div>
                    
                    
                    <button class="col-md-4 col-md-offset-4 btn"
                     style="background-color:#ffffff; color:#2b302f; 
                     font-size:20px; margin-top:10px;"
                     type="submit" > Submit
                    </button>
                    </center></div>
                    </form>


			</div>
